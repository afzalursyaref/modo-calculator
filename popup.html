<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modo Calculator</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- Title bar (macOS style) -->
    <header class="titlebar">
      <div class="traffic-lights" aria-hidden="true">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <div class="title">Modo Calculator</div>
      <div class="title-actions">
        <button class="icon-btn" id="btn-history" title="Riwayat" aria-label="Riwayat">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
        </button>
        <button class="icon-btn" id="btn-pip" title="Always on top (PiP)" aria-label="Pop out">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" title="Pengaturan" aria-label="Pengaturan">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Workspace: history (sidebar di mode lebar) + calculator -->
    <div class="workspace">

    <!-- History panel (overlay di mode sempit, sidebar di mode lebar) -->
    <aside class="panel panel-history" id="panel-history" hidden>
      <div class="panel-header">
        <button class="icon-btn back-btn" id="back-history" title="Kembali" aria-label="Kembali">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h2>Riwayat</h2>
        <button class="link-btn" id="clear-history">Hapus</button>
      </div>
      <ul class="history-list" id="history-list"></ul>
      <div class="panel-empty" id="history-empty">Belum ada riwayat</div>
    </aside>

    <main class="calculator">
    <!-- Display -->
    <section class="display" id="display">
      <div class="expr" id="expr" aria-live="polite"></div>
      <div class="preview" id="preview" aria-live="polite"></div>
      <div class="result" id="result" tabindex="0" aria-live="polite">0</div>
    </section>

    <!-- Toast (notif kecil utk paste info) -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Keypad -->
    <section class="keypad" id="keypad">
      <button class="btn btn-fn" data-action="open-paren">(</button>
      <button class="btn btn-fn" data-action="close-paren">)</button>
      <button class="btn btn-fn btn-bksp" data-action="backspace" aria-label="Hapus">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 5H9.5L2 12l7.5 7H22a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
      </button>

      <button class="btn btn-fn" data-action="clear">AC</button>
      <button class="btn btn-fn" data-action="sign">±</button>
      <button class="btn btn-fn" data-action="percent">%</button>
      <button class="btn btn-op" data-op="/">÷</button>

      <button class="btn btn-num" data-num="7">7</button>
      <button class="btn btn-num" data-num="8">8</button>
      <button class="btn btn-num" data-num="9">9</button>
      <button class="btn btn-op" data-op="*">×</button>

      <button class="btn btn-num" data-num="4">4</button>
      <button class="btn btn-num" data-num="5">5</button>
      <button class="btn btn-num" data-num="6">6</button>
      <button class="btn btn-op" data-op="-">−</button>

      <button class="btn btn-num" data-num="1">1</button>
      <button class="btn btn-num" data-num="2">2</button>
      <button class="btn btn-num" data-num="3">3</button>
      <button class="btn btn-op" data-op="+">+</button>

      <button class="btn btn-num btn-zero" data-num="0">0</button>
      <button class="btn btn-num" data-action="dot">,</button>
      <button class="btn btn-eq" data-action="equals">=</button>
    </section>
    </main>
    </div><!-- /.workspace -->

    <!-- Settings panel -->
    <aside class="panel panel-settings" id="panel-settings" hidden>
      <div class="panel-header">
        <button class="icon-btn back-btn" id="back-settings" title="Kembali" aria-label="Kembali">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h2>Pengaturan</h2>
        <span class="spacer"></span>
      </div>
      <div class="setting-group">
        <label>Pemisah ribuan</label>
        <div class="seg" data-seg="thousands">
          <button data-val=",">,</button>
          <button data-val=".">.</button>
          <button data-val=" ">spasi</button>
          <button data-val="">tidak ada</button>
        </div>
      </div>
      <div class="setting-group">
        <label>Pemisah desimal</label>
        <div class="seg" data-seg="decimal">
          <button data-val=".">.</button>
          <button data-val=",">,</button>
        </div>
      </div>
      <div class="setting-group">
        <label>Tema</label>
        <div class="seg" data-seg="theme">
          <button data-val="auto">Auto</button>
          <button data-val="light">Light</button>
          <button data-val="dark">Dark</button>
        </div>
      </div>
      <div class="setting-group">
        <label class="toggle">
          <input type="checkbox" id="opt-smartpaste" checked />
          <span>Smart paste (auto-deteksi format)</span>
        </label>
      </div>
      <div class="setting-group">
        <label class="toggle">
          <input type="checkbox" id="opt-multisum" checked />
          <span>Excel multi-cell → jumlahkan</span>
        </label>
      </div>
      <div class="setting-hint">
        Tip: tekan <kbd>Ctrl/Cmd + V</kbd> untuk paste angka dari mana saja, format akan dikonversi otomatis.
      </div>
    </aside>
  </div>

  <script src="calc-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
